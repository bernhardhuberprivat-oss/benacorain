[build]
  publish = "."

# Seepegel (ARPAV) läuft über netlify/functions/seepegel-lesen.mjs (kein Redirect nötig,
# Functions sind automatisch unter /.netlify/functions/<name> erreichbar).

# ARPA Lombardia / Socrata (Niederschlag) – Proxy vermeidet CORS- und Cache-Ärger
[[redirects]]
  from = "/api/lombardia/*"
  to = "https://www.dati.lombardia.it/resource/:splat"
  status = 200
  force = true

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
